name: Deployer API contract

# Guardrail for the v1 REST contract:
#   1. regenerate openapi.json from the current code
#   2. diff it against the committed baseline (deployer/openapi.json)
#   3. if the spec changed, require the PR to also touch CHANGELOG.md
#      under an "## API" heading -- the canonical place we document
#      breaking / non-breaking changes for clients.
#
# To bump the baseline locally before opening a PR:
#   cd deployer && npm run openapi:gen && git add openapi.json

on:
  pull_request:
    paths:
      - 'deployer/src/api/**'
      - 'deployer/src/auth.ts'
      - 'deployer/openapi.json'
      - 'CHANGELOG.md'
      - '.github/workflows/deployer-api-contract.yml'
  push:
    branches: [main]

jobs:
  openapi-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: deployer/package-lock.json

      - name: install deployer deps
        working-directory: deployer
        run: npm ci --no-audit --no-fund

      - name: regenerate openapi.json
        working-directory: deployer
        run: npx ts-node scripts/generate-openapi.ts /tmp/openapi-new.json

      - name: compare to committed baseline
        id: diff
        working-directory: deployer
        run: |
          if [ ! -f openapi.json ]; then
            echo "no baseline yet; creating one in this run is fine"
            cp /tmp/openapi-new.json openapi.json
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if diff -u openapi.json /tmp/openapi-new.json > /tmp/openapi.diff; then
            echo "spec unchanged"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "spec changed:"
            cat /tmp/openapi.diff
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: require CHANGELOG ## API entry when spec changed
        if: steps.diff.outputs.changed == 'true'
        run: |
          if [ ! -f CHANGELOG.md ]; then
            echo "::error::OpenAPI spec changed but CHANGELOG.md does not exist."
            echo "Create CHANGELOG.md with an '## API' section describing the change."
            exit 1
          fi
          # Look for an "## API" heading anywhere in CHANGELOG.md that was
          # touched in this PR (or in this push).
          if ! git diff --unified=0 origin/${{ github.base_ref || 'main' }}...HEAD -- CHANGELOG.md | grep -q '^+.*## API'; then
            echo "::error::OpenAPI spec changed but CHANGELOG.md has no new '## API' entry in this PR."
            echo "Add one describing whether the change is breaking, additive, or a fix."
            exit 1
          fi
          echo "CHANGELOG.md has a new ## API entry."
